<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>同時凸 最適組み合わせ計算機 v0</title><style>
:root{--b:#2563eb;--bg:#f3f6fb;--line:#d6deea;--tx:#172033;--mut:#667085;--green:#eafbf0;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;padding:0 0 74px}.wrap{max-width:980px;margin:auto;padding:6px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin:6px 0}.hero h1{font-size:19px;margin:3px 0}.card h2{font-size:17px;margin:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:2px 0 6px}.note{font-size:10px;color:var(--mut);margin:0;text-align:right}.tools{display:flex;gap:4px;flex-wrap:wrap}.section-head .tools{flex-wrap:nowrap}.btn{border:0;border-radius:8px;min-height:34px;padding:5px 9px;font-weight:800}.section-head .btn{min-height:30px;font-size:11px;padding:4px 7px}.add{background:#dbeafe;color:#1d4ed8}.secondary{background:#e7edf7}.settings{display:grid;grid-template-columns:1fr 1fr;gap:6px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:2px}.hp-inline{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px}.hp-inline label{margin:0;white-space:nowrap}.inputrow{display:grid;grid-template-columns:minmax(0,1fr) 23px;gap:2px;align-items:center}.inputrow span{font-size:10px;color:var(--mut)}input,select{width:100%;min-width:0;min-height:32px;border:1px solid #c8d3e2;border-radius:7px;padding:4px 6px;font-size:14px;background:#fff}.condition-details{grid-column:1/-1}.condition-details summary{cursor:pointer;list-style:none;font-size:12px;font-weight:800;color:var(--b);padding:6px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;text-align:center}.condition-details summary::-webkit-details-marker{display:none}.detail-settings{margin-top:6px;grid-template-columns:1fr 1fr}.carry-box{grid-column:1/-1;border-top:1px solid var(--line);padding-top:5px}.carry-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.carry-head strong{font-size:11px}.carry-actions{display:flex;gap:7px}.mini{border:0;border-radius:7px;min-height:31px;padding:4px 10px;font-size:11px;font-weight:800;background:#e7edf7}.carry-labels,.carry-row{display:grid;grid-template-columns:1fr 1.3fr 34px;gap:4px;align-items:center}.carry-labels{font-size:9px;color:var(--mut);padding:3px 2px 0}.carry-row{margin-top:3px}.delete-point,.delete-person{border:1px solid #fecaca;border-radius:7px;background:#fff;color:var(--danger);font-size:10px;font-weight:800;padding:0}.delete-point{width:34px;min-height:30px}.candidate-header,.candidate{display:grid;grid-template-columns:minmax(64px,1fr) minmax(88px,1.45fr) 44px 38px;gap:4px;align-items:center}.candidate-header{font-size:9px;font-weight:700;color:var(--mut);padding:0 2px 2px}.candidate{border:0;border-radius:0;padding:1px 0;margin:2px 0}.carry-cell{display:flex;justify-content:center}.carry-check{width:20px;min-height:20px;accent-color:var(--b)}.delete-person{width:38px;min-height:30px}.delete-person:disabled{opacity:.35}.candidate-tools{margin-top:4px;justify-content:flex-end}.calcbar{position:fixed;z-index:9;bottom:0;left:0;right:0;padding:7px;background:#fffc;border-top:1px solid var(--line)}.primary{display:block;width:min(966px,100%);margin:auto;background:var(--b);color:#fff;font-size:15px}.summary{display:flex;gap:7px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;white-space:nowrap;overflow:auto;font-size:11px}.metric{display:flex;align-items:baseline;gap:3px}.metric+.metric:before{content:"｜";color:var(--line);margin-right:3px}.metric small{color:var(--mut)}.result{border:1px solid var(--line);border-radius:8px;padding:5px;margin-top:5px}.result.best{background:var(--green)}.result-summary{display:grid;grid-template-columns:36px minmax(0,1fr) 63px;gap:4px;align-items:center;cursor:pointer}.rank,.seconds{font-weight:850}.seconds{text-align:right;white-space:nowrap;font-size:12px}.seconds small{font-size:9px;color:var(--mut)}.order{font-size:11px;font-weight:720;line-height:1.35;overflow-wrap:anywhere}.details{display:none;border-top:1px solid var(--line);margin-top:5px;padding-top:4px}.details.open{display:block}.rows{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.r{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px 0;border-bottom:1px dashed #dde3ec}.r span:first-child{font-size:10px;color:var(--mut)}.r span:last-child{text-align:right;font-size:11px;font-weight:700}.hidden{display:none}.toast{position:fixed;z-index:99;left:50%;bottom:72px;transform:translate(-50%,10px);background:#172033;color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.rows{grid-template-columns:1fr}.section-head .note{white-space:normal;line-height:1.2}.hero h1{font-size:17px}.card{padding:7px}.detail-settings{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><header class="hero"><h1>同時凸 最適組み合わせ計算機 <small>v0</small></h1></header>
<section class="card"><div class="section-head"><h2>計算条件</h2></div><div class="settings"><div class="field hp-inline"><label>残りHP</label><div class="inputrow"><input id="hp" type="number" inputmode="decimal"><span>万</span></div></div><details class="condition-details"><summary>詳細▼</summary><div class="settings detail-settings"><div class="field"><label>表示件数</label><select id="limit"><option value="10">上位10件</option><option value="20">上位20件</option><option value="50">上位50件</option><option value="99999" selected>全件</option></select></div><div class="field"><label>持ち越し下限</label><div class="inputrow"><input id="floor" type="number" value="20"><span>秒</span></div></div><div class="field"><label>持ち越し上限</label><div class="inputrow"><input id="cap" type="number" value="90"><span>秒</span></div></div><div class="field"><label>本戦時間</label><div class="inputrow"><input id="battle" type="number" value="90"><span>秒</span></div></div><div class="field"><label>討伐加算</label><div class="inputrow"><input id="bonus" type="number" value="20"><span>秒</span></div></div><div class="carry-box"><div class="carry-head"><strong>持ち越しDMG基準</strong><div class="carry-actions"><button class="mini" id="addPoint">追加</button><button class="mini" id="copyPoints">コピー</button><button class="mini" id="clearPoints">クリア</button></div></div><div class="carry-labels"><span>秒以上</span><span>予定DMG</span><span></span></div><div id="points"></div></div></div></details></div></section>
<section class="card"><div class="section-head"><h2>候補者</h2><p class="note">DMG空欄は対象外・最低2人</p></div><div class="candidate-header"><span>参加者名</span><span>予定DMG</span><span>持越凸</span><span>削除</span></div><div id="candidates"><div class="candidate" data-id="0"><input class="person-name" value="1"><input class="person-dmg" type="number" inputmode="numeric"><div class="carry-cell"><input class="carry-check" type="checkbox"></div><button class="delete-person" disabled>削除</button></div><div class="candidate" data-id="1"><input class="person-name" value="2"><input class="person-dmg" type="number" inputmode="numeric"><div class="carry-cell"><input class="carry-check" type="checkbox"></div><button class="delete-person" disabled>削除</button></div></div><div class="tools candidate-tools"><button class="btn add" id="addPerson">参加者を追加</button><button class="btn secondary" id="sample">サンプル</button><button class="btn secondary" id="copyPeople">コピー</button><button class="btn secondary" id="clear">クリア</button></div></section>
<section class="card hidden" id="output"><div class="section-head"><h2 id="resultTitle">結果（持ち越し秒数順）</h2><div class="tools"><button class="btn secondary" id="copy">コピー</button><button class="btn add" id="csv">CSV出力</button><button class="btn secondary" id="txt">TXT出力</button></div></div><div class="summary" id="summary"></div><div id="results"></div></section></main><div class="calcbar"><button class="btn primary" id="calc">全組み合わせを計算</button></div><div class="toast" id="toast"></div>
<script>
'use strict';const $=x=>document.getElementById(x),fmt=x=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:0}).format(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let nextId=2;const KEY='coTimeCarryDmgPointsV23';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1500)}
function rawPoints(){return [...document.querySelectorAll('.carry-row')].map(r=>({sec:r.querySelector('.psec').value,dmg:r.querySelector('.pdmg').value}))}function config(){const raw=rawPoints();if(!raw.length||!raw.every(x=>x.sec!==''&&x.dmg!==''&&Number.isFinite(+x.sec)&&Number.isFinite(+x.dmg)&&+x.sec>=0&&+x.dmg>=0))return{enabled:false,points:[]};const points=raw.map(x=>({sec:+x.sec,dmg:+x.dmg})).sort((a,b)=>a.sec-b.sec);if(new Set(points.map(x=>x.sec)).size!==points.length)return{enabled:false,points:[]};return{enabled:true,points}}
function savePoints(){try{localStorage.setItem(KEY,JSON.stringify(rawPoints()))}catch(e){}}function addPoint(sec='',dmg='',save=true){const r=document.createElement('div');r.className='carry-row';r.innerHTML=`<input class="psec" type="number" inputmode="numeric" min="0" value="${esc(sec)}"><input class="pdmg" type="number" inputmode="numeric" min="0" value="${esc(dmg)}"><button class="delete-point">削除</button>`;r.querySelectorAll('input').forEach(x=>x.oninput=savePoints);r.querySelector('button').onclick=()=>{r.remove();savePoints()};$('points').appendChild(r);if(save)savePoints()}function loadPoints(){let a=[];try{a=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}if(Array.isArray(a))a.forEach(x=>addPoint(x.sec??'',x.dmg??'',false))}function carryDmg(sec,finalDmg,cfg){if(!cfg.enabled)return 0;if(sec===90){const p=cfg.points.find(x=>x.sec===90);return p?p.dmg:finalDmg}let v=0;for(const p of cfg.points){if(p.sec>sec)break;v=p.dmg}return v}
$('addPoint').onclick=()=>addPoint();$('copyPoints').onclick=async()=>{const a=rawPoints();if(!a.length)return toast('コピーする設定がありません。');const text=a.map(x=>`${x.sec||'未入力'}秒以上：${x.dmg||'未入力'}万`).join('\r\n');await copyText(text,'持ち越しDMG基準をコピーしました。')};$('clearPoints').onclick=()=>{$('points').innerHTML='';savePoints();toast('持ち越しDMG設定をクリアしました。')};loadPoints();
function updateDeletes(){const a=[...document.querySelectorAll('.candidate')],d=a.length<=2;a.forEach(r=>r.querySelector('.delete-person').disabled=d)}function bindDelete(r){r.querySelector('.delete-person').onclick=()=>{if(document.querySelectorAll('.candidate').length<=2)return;r.remove();updateDeletes()}}function addPerson(){const id=nextId++,r=document.createElement('div');r.className='candidate';r.dataset.id=id;r.innerHTML=`<input class="person-name" value="${id+1}"><input class="person-dmg" type="number" inputmode="numeric"><div class="carry-cell"><input class="carry-check" type="checkbox"></div><button class="delete-person">削除</button>`;bindDelete(r);$('candidates').appendChild(r);updateDeletes()}[...document.querySelectorAll('.candidate')].forEach(bindDelete);updateDeletes();$('addPerson').onclick=addPerson;
async function copyText(text,success){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(success)}catch(e){alert('コピーできませんでした。')}}
$('copyPeople').onclick=async()=>{const rows=[...document.querySelectorAll('.candidate')],text=rows.map(r=>`${r.querySelector('.person-name').value.trim()||'未入力'}｜${r.querySelector('.person-dmg').value.trim()||'未入力'}${r.querySelector('.carry-check').checked?'｜持越凸':''}`).join('\r\n');await copyText(text,'候補者をコピーしました。')};
function people(){return [...document.querySelectorAll('.candidate')].map((r,i)=>{const raw=r.querySelector('.person-dmg').value.trim();return{id:+r.dataset.id,name:r.querySelector('.person-name').value.trim()||String(i+1),raw,d:+raw,carry:r.querySelector('.carry-check').checked}}).filter(x=>x.raw&&x.d>0)}
function calc(){const hp=+$('hp').value,battle=+$('battle').value,bonus=+$('bonus').value,floor=+$('floor').value,cap=+$('cap').value,ps=people(),limit=+$('limit').value,cfg=config();if(!(floor>=0&&cap>=floor))return alert('持ち越し下限は上限以下で入力してください。');if(!(hp>0))return alert('残りHPを入力してください。');if(ps.length<2)return alert('DMG入力済みの候補者を2人以上用意してください。');const den=battle+bonus-cap,rows=[];for(const final of ps){if(final.carry)continue;const pool=ps.filter(x=>x.id!==final.id);function search(start,sel,sum){const remain=hp-sum;if(remain<=0)return;if(sel.length&&final.d>=remain){const carry=Math.max(0,Math.min(cap,Math.ceil(battle-battle*remain/final.d+bonus)));if(carry>=floor&&carry<=cap){const group=[...sel,final],unused=ps.filter(x=>!group.some(y=>y.id===x.id)),unusedTotal=unused.reduce((a,x)=>a+x.d,0),cd=carryDmg(carry,final.d,cfg);rows.push({group,unused,final,fixed:sum,remain,carry,cd,evaluated:unusedTotal+cd,full:den>0?battle*remain/den:null,total:sum+final.d,unusedTotal})}return}for(let i=start;i<pool.length;i++)search(i+1,[...sel,pool[i]],sum+pool[i].d)}search(0,[],0)}if(cfg.enabled){rows.sort((a,b)=>b.evaluated-a.evaluated||b.cd-a.cd||b.carry-a.carry||a.group.length-b.group.length||b.total-a.total);$('resultTitle').textContent='結果（持ち越しDMG含む評価順）'}else{rows.sort((a,b)=>b.carry-a.carry||a.group.length-b.group.length||b.total-a.total);$('resultTitle').textContent='結果（持ち越し秒数順）'}const shown=rows.slice(0,limit);$('summary').innerHTML=`<div class="metric"><small>入力候補者</small><strong>${ps.length}人</strong></div><div class="metric"><small>有効な最小構成</small><strong>${rows.length}通り</strong></div>`;$('results').innerHTML=shown.map((r,i)=>{const selected=r.group.map(x=>`${x.id===r.final.id?'【最後】':''}${esc(x.name)}（${fmt(x.d)}）${x.carry?'（持越）':''}`).join('＋'),rest=r.unused.length?'、【残】'+r.unused.map(x=>`${esc(x.name)}（${fmt(x.d)}）`).join('+'):'',order=selected+rest,id='d'+i,extra=cfg.enabled?`<div class="r"><span>持ち越しDMG</span><span>${fmt(r.cd)}万</span></div><div class="r"><span>持越込残総DMG</span><span>${fmt(r.evaluated)}万</span></div>`:'';return `<article class="result ${i===0?'best':''}"><div class="result-summary" data-target="${id}"><div class="rank">${i+1}位</div><div class="order">${order}</div><div class="seconds">${r.carry}秒${cfg.enabled?`<br><small>${fmt(r.evaluated)}万</small>`:''}</div></div><div class="details" id="${id}"><div class="rows"><div class="r"><span>同時凸人数</span><span>${r.group.length}人</span></div><div class="r"><span>最後の担当</span><span>${esc(r.final.name)}</span></div><div class="r"><span>総DMG</span><span>${fmt(r.total)}万</span></div><div class="r"><span>残総DMG</span><span>${fmt(r.unusedTotal)}万</span></div>${extra}<div class="r"><span>最後以外の合計</span><span>${fmt(r.fixed)}万</span></div><div class="r"><span>最後直前の残りHP</span><span>${fmt(r.remain)}万</span></div><div class="r"><span>フル持ち越し必要DMG</span><span>${r.full===null?'－':fmt(r.full)+'万'}</span></div></div></div></article>`}).join('');document.querySelectorAll('.result-summary').forEach(x=>x.onclick=()=>$(x.dataset.target).classList.toggle('open'));$('output').classList.remove('hidden');$('output').scrollIntoView({behavior:'smooth'})}
function data(){return [...document.querySelectorAll('.result')].map((a,i)=>{const s=a.querySelector('.result-summary'),p=[...a.querySelectorAll('.r')].reduce((o,r)=>{const x=r.querySelectorAll('span');o[x[0].textContent]=x[1].textContent;return o},{});return{rank:i+1,order:s.querySelector('.order').textContent,carry:s.querySelector('.seconds').childNodes[0].textContent,...p}})}function share(){return data().map(r=>`${r.rank}位 ${r.order} ${r.carry}${r['持ち越しDMG']?` 持ち越しDMG：${r['持ち越しDMG']} 持越込残総DMG：${r['持越込残総DMG']}`:` 残総DMG：${r['残総DMG']}`}`).join('\r\n')}function download(n,t,type){const b=new Blob(['\ufeff'+t],{type:type+';charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('copy').onclick=async()=>{const t=share();if(!t)return alert('先に計算してください。');await copyText(t,'結果をコピーしました。')};$('txt').onclick=()=>{const t=share();if(!t)return alert('先に計算してください。');download('co_time_results_v0.txt',t,'text/plain')};$('csv').onclick=()=>{const d=data();if(!d.length)return alert('先に計算してください。');const h=['順位','順番','持ち越し秒数','同時凸人数','最後の担当','総DMG','残総DMG','持ち越しDMG','持越込残総DMG','最後以外の合計','最後直前の残りHP','フル持ち越し必要DMG'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('co_time_results_v0.csv',[h.map(q).join(','),...d.map(r=>[r.rank,r.order,r.carry,r['同時凸人数'],r['最後の担当'],r['総DMG'],r['残総DMG'],r['持ち越しDMG'],r['持越込残総DMG'],r['最後以外の合計'],r['最後直前の残りHP'],r['フル持ち越し必要DMG']].map(q).join(','))].join('\r\n'),'text/csv')};
$('calc').onclick=calc;$('sample').onclick=()=>{const v=[50000,53000,48000,22000,15000,54000,45000,19000],carry=[false,false,false,true,true,false,false,true];$('hp').value=90000;[...document.querySelectorAll('.candidate')].forEach((r,i)=>{r.querySelector('.person-name').value=String(i+1);r.querySelector('.person-dmg').value=v[i%v.length];r.querySelector('.carry-check').checked=carry[i%carry.length]})};$('clear').onclick=()=>{$('hp').value='';[...document.querySelectorAll('.candidate')].forEach((r,i)=>{r.querySelector('.person-name').value=String(i+1);r.querySelector('.person-dmg').value='';r.querySelector('.carry-check').checked=false});$('output').classList.add('hidden')};
</script></body></html>
